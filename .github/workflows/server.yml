# Server: jalankan test, lalu build & publish image Docker ke GitHub Container
# Registry (ghcr.io/<owner>/<repo>/server) setiap push ke main.
name: Server

on:
  push:
    branches: [main]
    paths: ["apps/server/**", "docker-compose.yml", "deploy/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["apps/server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/requirements*.txt
      - name: Cache bobot model DeepFace
        uses: actions/cache@v4
        with:
          path: ~/.deepface
          key: deepface-facenet-onnx-v1
      - run: pip install -r requirements-dev.txt
      - run: python tests/download_fixtures.py
      - run: pytest -q

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: apps/server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
