# Build aplikasi mobile: APK Android & iOS (tanpa code signing, di runner macOS).
#
# Alamat server yang ditanam di aplikasi (urutan prioritas):
#   1. input "api_base_url" saat Run workflow manual
#   2. repository variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables)
#   3. kosong = default di kode (bisa diubah dari menu Server di aplikasi)
name: Mobile

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Alamat server API, mis. https://absensi.domainanda.com"
        required: false
        default: ""

env:
  FLUTTER_VERSION: "3.44.0"
  API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL || '' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: |
          if [ -n "$API_BASE_URL" ]; then DEFINE="--dart-define=API_BASE_URL=$API_BASE_URL"; fi
          flutter build apk --release $DEFINE
      - uses: actions/upload-artifact@v4
        with:
          name: absensi-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Unduh model ML Kit
        run: bash ios/download_mlkit_bundles.sh
      - run: flutter pub get
      - name: Build iOS tanpa code signing
        run: |
          if [ -n "$API_BASE_URL" ]; then DEFINE="--dart-define=API_BASE_URL=$API_BASE_URL"; fi
          flutter build ios --release --no-codesign $DEFINE
      - name: Paketkan .ipa (belum ditandatangani)
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr absensi-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: absensi-ios-unsigned
          path: apps/mobile/build/ios/iphoneos/absensi-unsigned.ipa
